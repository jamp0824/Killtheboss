<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kill the Boss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">

        <!-- Title Screen -->
        <div id="title-screen" class="screen active">
            <div class="title-content">
                <div class="title-boss-art">💀</div>
                <h1>KILL THE BOSS</h1>
                <p class="subtitle">Face the darkness. Survive the storm.</p>
                <button id="start-btn" class="big-btn">BEGIN YOUR QUEST</button>
            </div>
        </div>

        <!-- Battle Screen -->
        <div id="battle-screen" class="screen">

            <div id="boss-area">
                <div id="boss-info">
                    <div id="boss-name-display">???</div>
                    <div id="boss-phase-badge">Phase I</div>
                </div>
                <div class="hp-bar-container" id="boss-hp-container">
                    <div id="boss-hp-bar" class="hp-bar boss-bar"></div>
                    <span id="boss-hp-text" class="hp-text">400 / 400</span>
                </div>
                <div id="boss-status-effects"></div>

                <div id="boss-sprite-area">
                    <div id="boss-sprite" class="boss-phase-1">
                        <div class="boss-body">
                            <div class="boss-glow"></div>
                            <div class="boss-face">😈</div>
                            <div class="boss-aura"></div>
                        </div>
                    </div>
                    <div id="hit-effect" class="hit-effect hidden">💥</div>
                </div>
            </div>

            <div id="combat-log">
                <div id="log-entries"></div>
            </div>

            <div id="player-area">
                <div id="player-info">
                    <div id="player-name-display">Hero</div>
                    <div id="player-status-effects"></div>
                </div>
                <div class="hp-bar-container">
                    <label>HP</label>
                    <div id="player-hp-bar" class="hp-bar player-bar"></div>
                    <span id="player-hp-text" class="hp-text">100 / 100</span>
                </div>
                <div class="hp-bar-container">
                    <label>MP</label>
                    <div id="player-mp-bar" class="mp-bar"></div>
                    <span id="player-mp-text" class="hp-text">60 / 60</span>
                </div>

                <div id="action-buttons">
                    <button class="action-btn" data-action="slash" title="Basic attack — always available">
                        <span class="btn-icon">⚔️</span>
                        <span class="btn-name">Slash</span>
                        <span class="btn-meta">10–20 dmg &bull; Free</span>
                    </button>
                    <button class="action-btn" data-action="power-strike" title="Powerful blow — costs MP">
                        <span class="btn-icon">💥</span>
                        <span class="btn-name">Power Strike</span>
                        <span class="btn-meta">25–40 dmg &bull; 20 MP</span>
                    </button>
                    <button class="action-btn" data-action="magic-bolt" title="Magic attack with stun chance">
                        <span class="btn-icon">✨</span>
                        <span class="btn-name">Magic Bolt</span>
                        <span class="btn-meta">20–30 dmg &bull; 15 MP &bull; Stun?</span>
                    </button>
                    <button class="action-btn" data-action="heal" title="Restore 30 HP">
                        <span class="btn-icon">💚</span>
                        <span class="btn-name">Heal</span>
                        <span class="btn-meta">+30 HP &bull; 25 MP</span>
                    </button>
                    <button class="action-btn" data-action="guard" title="Reduce damage and counter-attack">
                        <span class="btn-icon">🛡️</span>
                        <span class="btn-name">Guard</span>
                        <span class="btn-meta">Block 60% &bull; Free</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <div class="end-content">
                <div id="end-icon" class="end-icon"></div>
                <h2 id="end-title"></h2>
                <p id="end-message"></p>
                <div id="end-stats"></div>
                <button id="restart-btn" class="big-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
